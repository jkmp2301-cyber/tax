<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tax Form 2026</title>

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f5f7fa;
    }
    .form-card {
      max-width: 520px;
      margin: 60px auto;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      background: #ffffff;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="form-card">
    
    <h3 class="text-center mb-4 fw-bold">Tax Form 2026</h3>

    <form onsubmit="sendWhatsApp(); return false;">
      
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" id="fullName" class="form-control" placeholder="Enter your full name" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Phone Number</label>
        <input type="tel" id="phone" class="form-control" placeholder="Enter your phone number" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Subject</label>
        <input type="text" id="subject" class="form-control" placeholder="Subject" required>
      </div>

      <div class="mb-4">
        <label class="form-label">Message / Inquiry</label>
        <textarea id="msg" class="form-control" rows="4" placeholder="Enter your message"></textarea>
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-success btn-lg">
          Submit via WhatsApp
        </button>
      </div>

    </form>
  </div>
</div>

<script>
function sendWhatsApp() {
  let name = document.getElementById("fullName").value;
  let email = document.getElementById("email").value;
  let phone = document.getElementById("phone").value;
  let subject = document.getElementById("subject").value;
  let msg = document.getElementById("msg").value;

  let text =
    `Tax Form 2026%0A` +
    `--------------------%0A` +
    `Name: ${name}%0A` +
    `Email: ${email}%0A` +
    `Phone: ${phone}%0A` +
    `Subject: ${subject}%0A` +
    `Message: ${msg}`;

  let url = `https://wa.me/919562307843?text=${text}`;
  window.open(url, "_blank");
}
</script>

</body>
</html>
